name: Build Shopora Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Shopora repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21 for Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties', '**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build frontend with Render Backend URL
        env:
          CI: false
          VITE_API_URL: "https://shopora-backend-ng.onrender.com"
          VITE_BACKEND_URL: "https://shopora-backend-ng.onrender.com"
          VITE_API_BASE_URL: "https://shopora-backend-ng.onrender.com"
        run: |
          npm install --no-audit --no-fund
          npm run build || npx vite build

      - name: Wrap frontend/dist with Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps --no-audit --no-fund
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.shopora.app",
            "appName": "Shopora",
            "webDir": "dist",
            "server": {
              "androidScheme": "https",
              "cleartext": true
            },
            "plugins": {
              "CapacitorHttp": {
                "enabled": true
              }
            }
          }
          EOF
          if [ ! -d android ]; then
            npx cap add android
          fi
          
          # Inject memory settings to prevent Gradle from hanging
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> android/gradle.properties
          echo "org.gradle.daemon=true" >> android/gradle.properties
          
          npx cap sync android

      - name: Compile Shopora Android APK
        working-directory: ./frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Shopora APK
        uses: actions/upload-artifact@v4
        with:
          name: Shopora-Android-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
