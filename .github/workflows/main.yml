name: Build Shopora Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Shopora repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java 21 for Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Point all frontend API calls to Render and build
        env:
          CI: false
          VITE_API_URL: "https://shopora-gi8x.onrender.com"
          VITE_BACKEND_URL: "https://shopora-gi8x.onrender.com"
          VITE_API_BASE_URL: "https://shopora-gi8x.onrender.com"
        run: |
          # Replace any hardcoded localhost:8001 or localhost:8000 in src/ with your live Render URL
          find src -type f \( -name "*.ts" -o -name "*.tsx" \) -exec sed -i 's|http://localhost:8001|https://shopora-gi8x.onrender.com|g' {} +
          find src -type f \( -name "*.ts" -o -name "*.tsx" \) -exec sed -i 's|http://127.0.0.1:8001|https://shopora-gi8x.onrender.com|g' {} +
          find src -type f \( -name "*.ts" -o -name "*.tsx" \) -exec sed -i 's|http://localhost:8000|https://shopora-gi8x.onrender.com|g' {} +

          npm ci
          npm run build || npx vite build

      - name: Wrap frontend/dist with Capacitor + Native HTTP
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.shopora.app",
            "appName": "Shopora",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            },
            "plugins": {
              "CapacitorHttp": {
                "enabled": true
              }
            }
          }
          EOF
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Compile Shopora Android APK
        working-directory: ./frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Shopora APK
        uses: actions/upload-artifact@v4
        with:
          name: Shopora-Android-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
