name: Build Shopora Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Shopora repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java 21 for Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Point API calls to Render and clean error messages
        env:
          CI: false
          BACKEND_URL: "https://shopora-backend-ng.onrender.com"
        run: |
          export VITE_API_URL="$BACKEND_URL"
          export VITE_BACKEND_URL="$BACKEND_URL"
          export VITE_API_BASE_URL="$BACKEND_URL"

          # Safely replace localhost URLs with your Render backend URL
          find src -type f \( -name "*.ts" -o -name "*.tsx" -o -name "*.js" -o -name "*.jsx" \) -exec sed -i "s|http://localhost:8001|$BACKEND_URL|g" {} +
          find src -type f \( -name "*.ts" -o -name "*.tsx" -o -name "*.js" -o -name "*.jsx" \) -exec sed -i "s|http://127.0.0.1:8001|$BACKEND_URL|g" {} +
          find src -type f \( -name "*.ts" -o -name "*.tsx" -o -name "*.js" -o -name "*.jsx" \) -exec sed -i "s|localhost:8001|$BACKEND_URL|g" {} +

          # Clean up the awkward port error message so it reads professionally
          find src -type f \( -name "*.ts" -o -name "*.tsx" -o -name "*.js" -o -name "*.jsx" \) -exec sed -i 's|Make sure the server is running on port [^[:cntrl:]]*|Cannot connect to the backend. Please check your internet connection.|g' {} +

          npm ci
          npm run build || npx vite build

      - name: Wrap frontend/dist with Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.shopora.app",
            "appName": "Shopora",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Compile Shopora Android APK
        working-directory: ./frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Shopora APK
        uses: actions/upload-artifact@v4
        with:
          name: Shopora-Android-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
