name: Build Shopora Windows App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Shopora repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend for Windows
        shell: bash
        env:
          CI: false
          VITE_API_URL: "https://shopora-backend-ng.onrender.com"
          VITE_BACKEND_URL: "https://shopora-backend-ng.onrender.com"
          VITE_API_BASE_URL: "https://shopora-backend-ng.onrender.com"
        run: |
          npm install --no-audit --no-fund
          
          # This line fixes the exit code 1 / TS2307 error
          npm install react-router-dom --no-audit --no-fund
          
          if [ -f vite.config.ts ]; then
            sed -i "s/defineConfig({/defineConfig({ base: '.\/',/g" vite.config.ts
          fi
          
          npm run build || npx vite build

      - name: Inject Electron Desktop Wrapper
        shell: bash
        run: |
          npm install electron electron-builder --save-dev
          
          cat << 'EOF' > main.cjs
          const { app, BrowserWindow } = require('electron');
          const path = require('path');
          
          function createWindow() {
            const win = new BrowserWindow({
              width: 1280,
              height: 800,
              autoHideMenuBar: true,
              webPreferences: {
                nodeIntegration: true,
                contextIsolation: false
              }
            });
            win.loadFile(path.join(__dirname, 'dist', 'index.html'));
          }
          
          app.whenReady().then(createWindow);
          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit();
          });
          EOF
          
          cat << 'EOF' > electron-builder.json
          {
            "appId": "com.shopora.desktop",
            "productName": "Shopora",
            "directories": {
              "output": "release"
            },
            "compression": "store",
            "win": {
              "target": ["nsis"]
            },
            "files": [
              "dist/**/*",
              "main.cjs"
            ]
          }
          EOF

      - name: Compile Windows EXE
        shell: bash
        run: |
          npx electron-builder --win --config electron-builder.json -c.extraMetadata.main=main.cjs

      - name: Upload Shopora Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: Shopora-Windows-App
          path: frontend/release/*.exe

